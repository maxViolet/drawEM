<!doctype html>
<!-- Throwaway Step 7 visual prototype: three settings layouts switchable with ?variant=A|B|C. No production behavior or persistence. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>drawEM · Settings prototype</title>
  <style>
    :root{font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:#222831;background:#e9edf2}
    *{box-sizing:border-box}body{margin:0;padding:28px 20px 90px}button,input{font:inherit}button{cursor:pointer}
    .stage{max-width:1100px;margin:auto}.caption{display:flex;align-items:center;gap:10px;margin-bottom:22px;color:#49515d}.caption img{width:27px;height:27px}.caption small{margin-left:auto}
    .desktop{display:flex;align-items:flex-start;justify-content:center;gap:24px;flex-wrap:wrap}.tray{width:175px;background:#fff;border:1px solid #c8ced8;box-shadow:0 8px 25px #20242b18;border-radius:7px;padding:6px;flex:none}.tray div{padding:7px 10px;border-radius:4px}.tray .selected{background:#fce5dd;color:#9b310f}.tray .disabled{color:#707784}
    .window{width:720px;min-height:555px;background:#fff;border:1px solid #b9c1cd;border-radius:10px;box-shadow:0 18px 55px #1e283230;overflow:hidden}.titlebar{height:46px;display:flex;align-items:center;gap:10px;padding:0 18px;border-bottom:1px solid #e2e5ea}.titlebar img{width:22px}.titlebar strong{font-size:14px}.titlebar span{margin-left:auto;color:#69717e;font-size:12px}.intro{padding:22px 28px 14px}.intro h1{font-size:22px;margin:0 0 4px;font-weight:650}.intro p{margin:0;color:#586271}.tabs{display:flex;gap:22px;padding:0 28px;border-bottom:1px solid #dce1e7}.tabs button{background:transparent;border:0;padding:13px 2px;color:#515a67}.tabs button.active{color:#b43b18;border-bottom:3px solid #ef5630;font-weight:650}.panel{padding:22px 28px 26px;min-height:360px}.section{margin-bottom:24px}.section h2{font-size:15px;margin:0 0 6px}.hint{font-size:12px;color:#647080;margin:2px 0 14px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}.field{display:flex;flex-direction:column;gap:5px}.field label,.label{font-weight:600;font-size:12px;color:#414b58}.field input{height:34px;border:1px solid #aeb7c4;border-radius:5px;padding:5px 9px;background:#fff;color:#242933}.field input:focus,.slot button:focus,.footer button:focus{outline:2px solid #ef5630;outline-offset:2px}.colorline{display:flex;align-items:center;gap:8px}.colorline input[type=color]{width:40px;padding:3px}.colorline input[type=text]{width:105px}.colorline .sample-stroke{height:4px;width:55px;border-radius:9px;background:#ff4500;margin-left:8px}.shortcut{display:flex;gap:6px;align-items:center}.shortcut button{border:1px solid #aeb7c4;background:#fff;border-radius:5px;min-height:34px;padding:5px 10px;text-align:left;flex:1}.shortcut small{color:#687482}.footer{display:flex;align-items:center;gap:9px;padding:14px 28px;border-top:1px solid #e2e5ea;background:#fafbfc}.footer .spacer{flex:1}.footer button,.slot button{border:1px solid #aab4c0;background:#fff;border-radius:5px;min-height:34px;padding:5px 12px}.footer .primary{background:#d74320;color:#fff;border-color:#d74320;font-weight:600}.footer .primary:hover{background:#b9391c}.notice{font-size:12px;color:#586271}.slots{display:grid;gap:8px}.slot{display:grid;grid-template-columns:36px minmax(0,1fr) 128px 80px;align-items:center;gap:10px;border:1px solid #e0e5eb;border-radius:7px;padding:9px 11px}.slot .number{font-weight:700;color:#b63c1c}.slot .filename{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.slot .empty{color:#737d89}.slot .sample{color:#b63c1c}.slot .sample:disabled{color:#9aa1aa;background:#f3f4f6;cursor:default}.slot .shortcut-btn{font-size:12px}.slot .filename button{border:0;padding:0;min-height:auto;color:#b63c1c;text-decoration:underline}.slot .filename button:hover{text-decoration:none}.callout{border-left:3px solid #ff5a32;background:#fff3ed;padding:10px 13px;color:#694332;margin-bottom:16px;font-size:12px}
    .variant-b .window{display:grid;grid-template-columns:165px 1fr}.variant-b .titlebar{grid-column:1/-1}.variant-b .intro{grid-column:2;grid-row:2;padding-bottom:4px}.variant-b .tabs{grid-column:1;grid-row:2/5;display:flex;flex-direction:column;gap:3px;padding:20px 10px;background:#f6f7f9;border-right:1px solid #e2e5ea;border-bottom:0}.variant-b .tabs button{text-align:left;padding:10px 13px;border-radius:5px}.variant-b .tabs button.active{border:0;background:#fce5dd}.variant-b .panel{grid-column:2;grid-row:3;padding-top:15px}.variant-b .footer{grid-column:2;grid-row:4}
    .variant-c .window{width:790px;background:#252a31;color:#edf0f4;border-color:#3e4650}.variant-c .titlebar{background:#20252b;border-color:#3e4650}.variant-c .titlebar span,.variant-c .intro p,.variant-c .hint,.variant-c .notice{color:#b8c1cc}.variant-c .tabs{border-color:#3e4650}.variant-c .tabs button{color:#bac2cd}.variant-c .tabs button.active{color:#ffb199}.variant-c .panel{background:#252a31}.variant-c .field label,.variant-c .label{color:#d9dfe6}.variant-c .field input,.variant-c .shortcut button,.variant-c .slot button,.variant-c .footer button:not(.primary){background:#323942;border-color:#58616d;color:#f2f4f7}.variant-c .slot{border-color:#48515d}.variant-c .slot .number,.variant-c .slot .sample{color:#ffad91}.variant-c .footer{background:#20252b;border-color:#3e4650}.variant-c .callout{background:#3b302d;color:#ffd2c2}.variant-c .slot .empty{color:#b9c1ca}.variant-c .colorline input[type=color]{padding:2px}.variant-c .footer .primary{background:#ed633e;border-color:#ed633e;color:#1d2228}.variant-c .panel .slots{display:grid;grid-template-columns:1fr 1fr}.variant-c .slot{grid-template-columns:24px minmax(0,1fr);gap:5px}.variant-c .slot .shortcut-btn,.variant-c .slot .sample{grid-row:2}.variant-c .slot .shortcut-btn{grid-column:1/3}.variant-c .slot .sample{grid-column:1/3}
    .issues,.field-error{color:#a92f16;font-size:12px}.issues{margin-top:12px}.issues:empty,.field-error:empty{display:none}.field input[aria-invalid="true"]{border:2px solid #b22f17;background:#fff4f0}.footer .primary:disabled{background:#aeb4bd;border-color:#aeb4bd;cursor:default}.variant-c .issues,.variant-c .field-error{color:#ffb099}.variant-c .field input[aria-invalid="true"]{background:#442f2b;border-color:#ff8f72}.variant-c .slot .shortcut-btn{grid-column:1/3;grid-row:2}.variant-c .slot .sample{grid-column:1/3;grid-row:3}
    .switcher{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#20242b;color:white;padding:8px;border-radius:999px;box-shadow:0 6px 25px #0005;z-index:2}.switcher button{height:32px;width:35px;border:0;border-radius:30px;background:#454d59;color:#fff;font-size:18px}.switcher span{min-width:190px;text-align:center;font-size:12px}.toast{position:fixed;top:20px;right:20px;background:#20242b;color:#fff;border-radius:6px;padding:10px 14px;box-shadow:0 8px 25px #0003;display:none;z-index:3}
    @media(max-width:760px){body{padding:16px 10px 90px}.desktop{gap:14px}.window,.variant-c .window{width:100%}.tray{width:100%}.fields{grid-template-columns:1fr}.variant-b .window{display:block}.variant-b .tabs{flex-direction:row;border-right:0;border-bottom:1px solid #e2e5ea;padding:0 20px}.variant-b .intro{padding:20px}.variant-b .panel{padding:20px}.variant-c .panel .slots{grid-template-columns:1fr}.slot{grid-template-columns:25px 1fr 100px 70px}.slot button{padding:5px}}
  </style>
</head>
<body>
  <div class="stage"><div class="caption"><img src="prototype-tray-icon.svg" alt="Proposed drawEM icon"><strong>drawEM</strong><span>Step 7 settings · throwaway visual prototype</span><small>Nothing here changes the running app</small></div><div class="desktop"><div class="tray" aria-label="Proposed tray menu"><div class="selected">Settings…</div><div class="disabled">Draw: Ctrl+Alt+Z</div><div class="disabled">Clear: Ctrl+Alt+X</div><hr><div>Exit</div></div><main class="window"><div class="titlebar"><img src="prototype-tray-icon.svg" alt=""><strong>drawEM Settings</strong><span>×</span></div><div class="intro"><h1 id="heading">Drawing</h1><p id="subtitle">Choose how drawing looks and which keys control it.</p></div><nav class="tabs" aria-label="Settings sections"><button type="button" data-tab="drawing" class="active">Drawing</button><button type="button" data-tab="actions">Actions · 8 slots</button></nav><div id="panel" class="panel"></div><div class="footer"><button type="button" id="defaults">Restore defaults</button><div class="spacer"></div><span class="notice">Changes take effect after Save</span><button type="button" id="cancel">Cancel</button><button type="button" class="primary" id="save">Save</button></div></main></div></div>
  <div class="switcher" aria-label="Prototype variant switcher"><button id="prev" aria-label="Previous variant">←</button><span id="variant-label"></span><button id="next" aria-label="Next variant">→</button></div><div id="toast" class="toast" role="status"></div>
  <script>
    // Prototype state stays in memory; Save and Sample only explain their intended behavior.
    const variants=['A','B','C'],names={A:'Compact Windows form',B:'Navigation rail',C:'Dark soundboard'};
    let variant=new URLSearchParams(location.search).get('variant')?.toUpperCase()||'A';if(!variants.includes(variant))variant='A';
    const defaults=()=>({color:'#FF4500',width:4,draw:'Ctrl+Alt+Z',clear:'Ctrl+Alt+X',slots:Array.from({length:8},()=>({file:'',shortcut:''}))});
    let tab='drawing';let draft=defaults();
    const panel=document.getElementById('panel');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function notice(message){const el=document.getElementById('toast');el.textContent=message;el.style.display='block';clearTimeout(notice.timer);notice.timer=setTimeout(()=>el.style.display='none',4200)}
    function drawing(){return `<div class="section"><h2>Stroke</h2><p class="hint">Applied to new strokes. Width is measured in physical pixels.</p><div class="fields"><div class="field"><label for="hex">Color · HEX</label><div class="colorline"><input id="picker" type="color" value="${esc(draft.color)}" aria-label="Stroke color picker"><input id="hex" type="text" value="${esc(draft.color)}" maxlength="7" spellcheck="false"><span class="sample-stroke" style="background:${esc(draft.color)}"></span></div></div><div class="field"><label for="width">Line width · 1–20 px</label><input id="width" type="number" min="1" max="20" step="1" value="${esc(draft.width)}" aria-describedby="width-error" aria-invalid="false"><span id="width-error" class="field-error" role="alert"></span></div></div></div><div class="section"><h2>Shortcuts</h2><p class="hint">Click a shortcut, then press at least two of Ctrl, Left Alt, and Shift plus a letter, digit, or F1–F12. Right Alt is reserved for AltGr.</p><div class="fields"><div class="field"><span class="label">Hold to draw</span><div class="shortcut"><button type="button" data-capture="draw">${esc(draft.draw)}</button></div></div><div class="field"><span class="label">Clear current monitor</span><div class="shortcut"><button type="button" data-capture="clear">${esc(draft.clear)}</button></div></div></div></div>`}
    function actions(){return `<div class="callout">One sound plays at a time. Sample plays a draft file for up to 10 seconds; changing a slot does not affect shortcuts until Save.</div><div class="slots">${draft.slots.map((s,i)=>`<div class="slot"><span class="number">${String(i+1).padStart(2,'0')}</span><div class="filename">${s.file?esc(s.file):'<span class="empty">No sound selected</span>'}<br><button type="button" data-file="${i}">${s.file?'Change file':'Choose WAV / MP3'}</button></div><button type="button" class="shortcut-btn" data-capture="slot-${i}" ${s.file?'':'disabled'}>${s.shortcut?esc(s.shortcut):'No shortcut'}</button><button type="button" class="sample" data-sample="${i}" ${s.file?'':'disabled'}>Sample</button></div>`).join('')}</div><input id="file-input" type="file" accept=".wav,.mp3,audio/wav,audio/mpeg" hidden>`}
    function issues(){const all=[draft.draw,draft.clear,...draft.slots.filter(s=>s.file).map(s=>s.shortcut)];return all.length===new Set(all).size?[]:['Two commands use the same shortcut.']}
    function widthError(){const value=String(draft.width).trim();if(!value)return 'Enter a width from 1 to 20 pixels.';if(!/^\d+$/.test(value))return 'Use a whole number of pixels.';const width=Number(value);if(width<1)return 'Minimum width is 1 pixel.';if(width>20)return 'Maximum width is 20 pixels.';return ''}
    function showIssues(){const errors=issues(),widthIssue=widthError(),width=panel.querySelector('#width');if(width){width.setAttribute('aria-invalid',String(Boolean(widthIssue)));panel.querySelector('#width-error').textContent=widthIssue}else if(widthIssue){errors.unshift(`Drawing width: ${widthIssue}`)}panel.querySelector('#issues').textContent=errors.join(' ');document.getElementById('save').disabled=Boolean(widthIssue||errors.length)}
    function render(){document.body.className='variant-'+variant.toLowerCase();document.getElementById('variant-label').textContent=`${variant} · ${names[variant]}`;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('heading').textContent=tab==='drawing'?'Drawing':'Actions';document.getElementById('subtitle').textContent=tab==='drawing'?'Choose how drawing looks and which keys control it.':'Assign a sound file and shortcut to any of eight slots.';panel.innerHTML=(tab==='drawing'?drawing():actions())+'<div id="issues" class="issues" role="alert"></div>';showIssues()}
    function setVariant(v){variant=variants[(variants.indexOf(v)+variants.length)%variants.length];const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
    document.getElementById('prev').onclick=()=>setVariant(variants[(variants.indexOf(variant)+2)%3]);document.getElementById('next').onclick=()=>setVariant(variants[(variants.indexOf(variant)+1)%3]);
    document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')setVariant(variants[(variants.indexOf(variant)+2)%3]);if(e.key==='ArrowRight')setVariant(variants[(variants.indexOf(variant)+1)%3])});
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});
    panel.addEventListener('input',e=>{if(e.target.id==='picker'){draft.color=e.target.value.toUpperCase();panel.querySelector('#hex').value=draft.color;panel.querySelector('.sample-stroke').style.background=draft.color}else if(e.target.id==='hex'){if(/^#[0-9a-fA-F]{6}$/.test(e.target.value)){draft.color=e.target.value.toUpperCase();panel.querySelector('.sample-stroke').style.background=draft.color;panel.querySelector('#picker').value=draft.color}}else if(e.target.id==='width'){draft.width=e.target.value;showIssues()}});
    let selectedSlot=0;panel.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.file!==undefined){selectedSlot=Number(b.dataset.file);panel.querySelector('#file-input').click()}else if(b.dataset.sample!==undefined){notice('Prototype only: Sample would play this draft sound through the global channel.')}else if(b.dataset.capture!==undefined){notice('Prototype only: the WPF window will capture a global shortcut here.')}});
    panel.addEventListener('change',e=>{if(e.target.id==='file-input'&&e.target.files[0]){const s=draft.slots[selectedSlot];s.file=e.target.files[0].name;if(!s.shortcut)s.shortcut=`Ctrl+Alt+${selectedSlot+1}`;render()}});
    document.getElementById('defaults').onclick=()=>{draft=defaults();render();notice('Defaults restored in the draft only.')} ;
    document.getElementById('cancel').onclick=()=>notice('Prototype only: Cancel would discard this draft and its imported files.');
    document.getElementById('save').onclick=()=>notice('Prototype only: Save would validate, persist, stop sound, exit drawing, and clear strokes.');
    render();
  </script>
</body>
</html>
