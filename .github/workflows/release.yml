name: Release

# A vX.Y.Z tag push builds, tests, and packages drawEM, then creates a draft release.
# The owner inspects the draft and publishes it manually; nothing here publishes it.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # Tests, builds, hashes, and attests the downloads. It cannot write to the repository.
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') {
            throw "Release runs only for tag pushes, not '$env:GITHUB_REF'."
          }
          $version = ./tools/release/Get-ReleaseVersion.ps1 -Tag $env:GITHUB_REF_NAME
          "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test DrawEM.sln -c Release

      - name: Publish
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: dotnet publish src/DrawEM.App/DrawEM.App.csproj -c Release -p:PublishProfile=win-x64 -p:Version=$env:VERSION -warnaserror

      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./tools/release/New-ReleasePackage.ps1 -PublishDirectory src/DrawEM.App/bin/Release/net8.0-windows/win-x64/publish -Version $env:VERSION -OutputDirectory artifacts

      # Setup.exe, the full update package, and the update feed, from the same publish folder as the ZIP.
      - name: Package installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $packId = (dotnet msbuild src/DrawEM.App/DrawEM.App.csproj -getProperty:VelopackPackId).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = ./tools/release/New-VelopackPackage.ps1 -PublishDirectory src/DrawEM.App/bin/Release/net8.0-windows/win-x64/publish -Version $env:VERSION -OutputDirectory velopack -PackId $packId -Icon src/DrawEM.App/Assets/drawEM.ico
          Copy-Item -LiteralPath $files -Destination artifacts

      # SHA256SUMS.txt is the one list of downloads: the attestation and the release upload both follow it.
      - name: Checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath artifacts -File | ForEach-Object FullName)
          ./tools/release/Write-Sha256Sums.ps1 -Path $files -OutputPath artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: artifacts/
          if-no-files-found: error

  # Only this job can write to the repository; it runs no repository code.
  release:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: artifacts

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # Upload exactly the files that SHA256SUMS.txt lists, plus the manifest itself.
          $files = @(Get-Content artifacts/SHA256SUMS.txt | ForEach-Object { Join-Path artifacts ($_ -split '  ', 2)[1] }) + 'artifacts/SHA256SUMS.txt'
          # --verify-tag stops gh from creating a missing tag from the default branch.
          gh release create $env:GITHUB_REF_NAME @files --draft --verify-tag --title "drawEM $env:VERSION" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $isDraft = gh release view $env:GITHUB_REF_NAME --json isDraft --jq .isDraft
          if ($isDraft -ne 'true') {
            throw "Release $env:GITHUB_REF_NAME is not a draft."
          }
