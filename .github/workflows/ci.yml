name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore DrawEM.sln

      - name: Build
        run: dotnet build DrawEM.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test DrawEM.sln -c Release --no-build

      # Coverlet instrumentation adds dependencies that the architecture tests intentionally reject.
      - name: Collect coverage
        run: dotnet test DrawEM.sln -c Release --no-build --filter "Category!=Architecture" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cobertura
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: error

      - name: Publish
        run: dotnet publish src/DrawEM.App/DrawEM.App.csproj -c Release -p:PublishProfile=win-x64 -warnaserror
