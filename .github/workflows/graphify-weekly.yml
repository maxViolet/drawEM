name: Graphify weekly

on:
  schedule:
    # Mondays 03:00 UTC.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh-graph:
    # Windows keeps node paths in graph.json the same as in local builds.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install graphify
        run: python -m pip install graphifyy==0.9.86

      - name: Rebuild graph
        run: graphify update .

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: graphify-weekly-refresh
        shell: bash
        run: |
          git add graphify-out
          if git diff --cached --quiet; then
            echo "Graph is up to date."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -m 'chore: weekly graphify graph refresh'
          git push --force origin "$BRANCH"

          if [[ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]]; then
            gh pr create --base main --head "$BRANCH" \
              --title 'DOC: refresh graphify graph' \
              --body $'## Summary\n- Weekly rebuild of the graphify knowledge graph.\n\n## Changes\n- `graphify-out/`: output of `graphify update .`.\n\n## Validation\n- `graphify update .` passed in the `Graphify weekly` workflow.'
          fi
