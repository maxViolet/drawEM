name: PR lint

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  naming:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name and PR title against AGENTS.md
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          BRANCH: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          # Work id: <TYPE>-<NNN> or a task id from the docs (S1-02, F03, S07), with optional .N.
          id='((DOC|FIX|TEST|FEAT)-[0-9]{3}|[A-Z][0-9]+(-[0-9]{2})?)(\.[0-9]+)?'
          status=0

          # Dependabot PRs are FIX work (see AGENTS.md). Dependabot cannot number them or name the
          # branch, so check only the 'FIX: <summary>' title set by .github/dependabot.yml. Check the
          # PR author, not github.actor: a human push to a Dependabot branch keeps these rules.
          if [[ "$AUTHOR" == 'dependabot[bot]' ]]; then
            if [[ ! "$TITLE" =~ ^FIX:\ [a-z].*[^.]$ ]]; then
              echo "::error::Dependabot title '$TITLE' must be 'FIX: <summary>' with a lowercase summary and no trailing period."
              exit 1
            fi
            exit 0
          fi

          if [[ ! "$BRANCH" =~ ^($id)-[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Branch '$BRANCH' must be '<TYPE>-<NNN>-<description>' or '<task-id>-<description>', lowercase words joined by hyphens."
            status=1
          fi
          branch_id="${BASH_REMATCH[1]}"

          if [[ ! "$TITLE" =~ ^($id):\ [a-z].*[^.]$ ]]; then
            echo "::error::Title '$TITLE' must be '<work-id>: <summary>' with a lowercase summary and no trailing period."
            status=1
          elif [[ -n "$branch_id" && "${BASH_REMATCH[1]}" != "$branch_id" ]]; then
            echo "::error::Title id '${BASH_REMATCH[1]}' does not match branch id '$branch_id'."
            status=1
          fi

          exit $status
